<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>臺灣語言輸入法 IME-TW</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>臺灣語言輸入法 <small>IME-TW</small></h1>
    <nav id="langs" role="group" aria-label="優先語言">
      <span class="label">優先語言</span>
      <button data-lang="nan" aria-pressed="true">臺語</button>
      <button data-lang="hak" aria-pressed="false">客語</button>
      <button data-lang="cmn" aria-pressed="false">華語</button>
    </nav>
  </header>

  <main>
    <textarea id="pad" placeholder="在這裡寫下你的故事… Write your story here…" aria-label="書寫區" spellcheck="false" autofocus></textarea>

    <div id="composer" aria-live="polite">
      <div id="buffer"></div>
      <ol id="cands"></ol>
    </div>

    <div id="hint"></div>

    <section id="kbd" aria-label="螢幕鍵盤"></section>

    <div class="tools">
      <button id="toggle-ime" aria-pressed="true">轉換</button>
      <button id="toggle-native" aria-pressed="false">系統鍵盤</button>
      <button id="copy">複製</button>
      <button id="clear">清除</button>
    </div>
  </main>

  <div id="popup" hidden role="listbox" aria-label="變體"></div>

  <footer>
    字典來源：教育部臺灣閩南語常用詞辭典、臺灣客家語常用詞辭典、重編國語辭典修訂本（目前為種子資料，詳見 README）。
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
